name: BDApps Daily Revenue Report

# No `schedule:` trigger on purpose: GitHub never fired this repo's cron
# (0 of 5 due runs on 2026-09-18/19, under three different times), so the
# daily run is started from outside by cron-job.org, which calls the
# workflow_dispatch API at 06:00 Asia/Dhaka -- see README section 5ক.
# Re-adding a schedule would double-send whenever GitHub does fire it.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python workflow.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_1_USERNAME: ${{ secrets.ACCOUNT_1_USERNAME }}
          ACCOUNT_1_PASSWORD: ${{ secrets.ACCOUNT_1_PASSWORD }}
          ACCOUNT_2_USERNAME: ${{ secrets.ACCOUNT_2_USERNAME }}
          ACCOUNT_2_PASSWORD: ${{ secrets.ACCOUNT_2_PASSWORD }}
          ACCOUNT_3_USERNAME: ${{ secrets.ACCOUNT_3_USERNAME }}
          ACCOUNT_3_PASSWORD: ${{ secrets.ACCOUNT_3_PASSWORD }}
          # New account: add ACCOUNT_4_USERNAME / ACCOUNT_4_PASSWORD here and as repo secrets.
          TIMEZONE: "Asia/Dhaka"
          REVENUE_SHARE_PERCENT: ${{ secrets.REVENUE_SHARE_PERCENT }}
